name: minhanos-next
services:
  desktop:
    build: .
    restart: unless-stopped
    ports:
      - "${MINHANOS_BIND_IP:-127.0.0.1}:${MINHANOS_PORT:-8081}:8081"
    environment:
      DATABASE_URL: "postgres://minhanos:${POSTGRES_PASSWORD}@db:5432/minhanos?sslmode=disable"
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    secrets:
      - bootstrap_password
    volumes:
      - desktop-data:/data
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: minhanos
      POSTGRES_DB: minhanos
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minhanos -d minhanos"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  bootstrap_password:
    file: ./secrets/bootstrap_password
volumes:
  database:
  desktop-data:
