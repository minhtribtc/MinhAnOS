name: minhanos-next
services:
  desktop:
    build:
      context: .
      args:
        VITE_DRIVE_URL: "${VITE_DRIVE_URL:-}"
    restart: unless-stopped
    ports:
      - "${MINHANOS_BIND_IP:-127.0.0.1}:${MINHANOS_PORT:-8081}:8081"
    environment:
      DATABASE_URL: "postgres://minhanos:${POSTGRES_PASSWORD}@db:5432/minhanos?sslmode=disable"
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DRIVE_INTERNAL_URL: http://drive:8082
      STORAGE_AGENT_SOCKET: /run/minhanos-storage/agent.sock
    secrets:
      - bootstrap_password
    volumes:
      - desktop-data:/data
      # Storage Manager talks to the root storage agent (docs/storage-agent.md); absent agent = plain volume only.
      - /run/minhanos-storage:/run/minhanos-storage:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  drive:
    build:
      context: .
      dockerfile: Drive.Dockerfile
    restart: unless-stopped
    ports:
      - "${MINHANOS_BIND_IP:-127.0.0.1}:${DRIVE_PORT:-8082}:8082"
    environment:
      DATABASE_URL: "postgres://minhanos:${POSTGRES_PASSWORD}@db:5432/minhanos?sslmode=disable"
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DRIVE_AGENT_SOCKET: /run/minhanos-files/agent.sock
      STORAGE_AGENT_SOCKET: /run/minhanos-storage/agent.sock
      ALLOW_PLATFORM_SESSIONS: "true"
      # Public links (ADR 0011): FILES_PUBLIC_URL is the address visitors use (e.g. https://files.example.com);
      # without it the link uses the host of the page with this port.
      FILES_PUBLIC_URL: "${FILES_PUBLIC_URL:-}"
      FILES_PUBLIC_PORT: "${DRIVE_PORT:-8082}"
    secrets: [bootstrap_password]
    volumes:
      - drive-files:/data
      - /run/minhanos-files:/run/minhanos-files:ro
      # Storage Q2: homes and Shared Folders on ZFS/Btrfs units (paths come from the storage agent).
      - /run/minhanos-storage:/run/minhanos-storage:ro
      - type: bind
        source: /srv/minhanos
        target: /srv/minhanos
        bind:
          propagation: rslave
          create_host_path: true
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: minhanos
      POSTGRES_DB: minhanos
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minhanos -d minhanos"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  bootstrap_password:
    file: ./secrets/bootstrap_password
volumes:
  database:
  desktop-data:
  drive-files:
