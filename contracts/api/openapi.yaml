  "components": {
    "securitySchemes": {
      "desktopSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "minhanos_session"
      },
      "driveSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "minhanos_drive_session"
      },
      "appDelegation": {
        "type": "http",
        "scheme": "bearer",
        "description": "Verified audience/resource/action-scoped app delegation; context.appId must match the verified principal. Not a user-supplied app identity."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]*$"
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string",
                "minLength": 1,
                "maxLength": 128
              },
              "details": {
                "type": "object",
                "additionalProperties": true
              }
            },
            "required": [
              "code",
              "message",
              "requestId",
              "details"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "LegacyError": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]*$"
          },
          "error": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "error"
        ]
      },
      "Profile": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "locale": {
            "enum": [
              "vi-VN",
              "en-US"
            ]
          },
          "theme": {
            "enum": [
              "light",
              "dark",
              "system"
            ]
          },
          "timeZone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        },
        "required": [
          "locale",
          "theme",
          "timeZone"
        ]
      },
      "Job": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "type": {
            "type": "string",
            "minLength": 1
          },
          "state": {
            "enum": [
              "queued",
              "running",
              "succeeded",
              "failed",
              "cancelled"
            ]
          },
          "progress": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "completed": {
                "type": "integer",
                "minimum": 0
              },
              "total": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0
              },
              "unit": {
                "enum": [
                  "bytes",
                  "items",
                  "steps"
                ]
              }
            },
            "required": [
              "completed",
              "total",
              "unit"
            ]
          },
          "attempt": {
            "type": "integer",
            "minimum": 0
          },
          "maxAttempts": {
            "type": "integer",
            "minimum": 1
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "error": {
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string",
                    "pattern": "^[A-Z][A-Z0-9_]*$"
                  },
                  "message": {
                    "type": "string"
                  },
                  "requestId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128
                  },
                  "details": {
                    "type": "object",
                    "additionalProperties": true
                  }
                },
                "required": [
                  "code",
                  "message",
                  "requestId",
                  "details"
                ]
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "id",
          "type",
          "state",
          "progress",
          "attempt",
          "maxAttempts",
          "createdAt",
          "updatedAt",
          "error"
        ]
      },
      "Upload": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "state": {
            "enum": [
              "created",
              "uploading",
              "completing",
              "completed",
              "cancelled",
              "expired",
              "failed"
            ]
          },
          "size": {
            "type": "integer",
            "minimum": 0
          },
          "partSize": {
            "type": "integer",
            "minimum": 1
          },
          "receivedParts": {
            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 1
            },
            "uniqueItems": true
          },
          "checksum": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "fileId": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "id",
          "state",
          "size",
          "partSize",
          "receivedParts",
          "checksum",
          "expiresAt",
          "fileId"
        ]
      },
      "FileResource": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "fileId": {
            "type": "string",
            "minLength": 1
          },
          "name": {
            "type": "string",
            "minLength": 1
          },
          "parentId": {
            "type": [
              "string",
              "null"
            ]
          },
          "kind": {
            "enum": [
              "file",
              "folder"
            ]
          },
          "mimeType": {
            "type": [
              "string",
              "null"
            ]
          },
          "size": {
            "type": "integer",
            "minimum": 0
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "etag": {
            "type": "string",
            "minLength": 1
          },
