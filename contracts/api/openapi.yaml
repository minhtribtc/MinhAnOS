  "components": {
    "securitySchemes": {
      "desktopSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "minhanos_session"
      },
      "driveSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "minhanos_drive_session"
      },
      "appDelegation": {
        "type": "http",
        "scheme": "bearer",
        "description": "Verified audience/resource/action-scoped app delegation; context.appId must match the verified principal. Not a user-supplied app identity."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]*$"
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string",
                "minLength": 1,
                "maxLength": 128
              },
              "details": {
                "type": "object",
                "additionalProperties": true
              }
            },
            "required": [
              "code",
              "message",
              "requestId",
              "details"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "LegacyError": {
