  <style>
    #minhan-files-design{--fs-bg:light-dark(#ffffff,#1c2130);--fs-side:light-dark(#f4f6fb,#222838);--fs-ink:light-dark(#28324c,#edf1fc);--fs-muted:light-dark(#768198,#a3aec6);--fs-line:light-dark(#e8ecf4,#343d51);--fs-accent:light-dark(#367bea,#7eacff);--fs-soft:light-dark(#edf4ff,#2b3c59);--fs-folder:light-dark(#e9b849,#edc162);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--fs-ink)}
    #minhan-files-design *{box-sizing:border-box}#minhan-files-design button,#minhan-files-design input{font:inherit}#minhan-files-design button{color:inherit}#minhan-files-design .fs-app{background:var(--fs-bg);border:1px solid var(--fs-line);border-radius:20px;overflow:hidden;min-height:650px;position:relative}#minhan-files-design .fs-chrome{display:flex;gap:12px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--fs-line);background:var(--fs-side)}#minhan-files-design .fs-logo{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:var(--fs-folder);color:#684a11}#minhan-files-design .fs-chrome strong{font-weight:600}#minhan-files-design .fs-badge{font-size:11px;color:var(--fs-muted);margin-left:auto;margin-right:90px}#minhan-files-design .fs-body{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:585px}#minhan-files-design .fs-sidebar{background:var(--fs-side);padding:22px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--fs-line)}#minhan-files-design button{background:none;border:0;border-radius:9px;padding:9px 12px;display:inline-flex;gap:9px;align-items:center;justify-content:center}#minhan-files-design button:hover{background:var(--fs-soft)}#minhan-files-design .fs-sidebar button{justify-content:flex-start;text-align:left;font-size:12px}#minhan-files-design button.is-active{background:var(--fs-soft);color:var(--fs-accent)}#minhan-files-design .fs-nav-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--fs-muted);padding:16px 12px 7px}#minhan-files-design .fs-nav-label:first-child{padding-top:0}#minhan-files-design svg{width:17px;height:17px;flex-shrink:0}#minhan-files-design .fs-account{margin-top:auto;padding:22px 9px 2px;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--fs-muted)}#minhan-files-design .fs-avatar{width:29px;height:29px;background:var(--fs-soft);border-radius:50%;display:grid;place-items:center;color:var(--fs-accent)}#minhan-files-design .fs-account strong{display:block;color:var(--fs-ink);font-size:12px;font-weight:500}#minhan-files-design .fs-main{min-width:0;display:flex;flex-direction:column}#minhan-files-design .fs-toolbar{padding:20px 23px 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}#minhan-files-design .fs-title{margin-right:auto}#minhan-files-design .fs-title h2{font-size:23px;letter-spacing:-.6px;font-weight:600;margin:0}#minhan-files-design .fs-title p{font-size:11px;color:var(--fs-muted);margin:3px 0 0}#minhan-files-design .fs-primary{background:var(--fs-accent);color:var(--fs-bg)}#minhan-files-design .fs-primary:hover{background:var(--fs-accent);opacity:.9}#minhan-files-design .fs-action{border:1px solid var(--fs-line);font-size:12px}#minhan-files-design .fs-tools{display:flex;align-items:center;gap:7px;padding:0 23px 16px;border-bottom:1px solid var(--fs-line);flex-wrap:wrap}#minhan-files-design .fs-search{display:flex;align-items:center;gap:8px;flex:1;min-width:140px;background:var(--fs-side);padding:8px 11px;border-radius:9px;color:var(--fs-muted)}#minhan-files-design .fs-search input{border:0;outline:none;background:transparent;color:var(--fs-ink);font-size:12px;width:100%;min-width:0}#minhan-files-design .fs-view-buttons{display:flex;gap:3px}#minhan-files-design .fs-view-buttons button{padding:8px}#minhan-files-design .fs-crumb{display:flex;align-items:center;gap:5px;padding:13px 16px;color:var(--fs-muted);font-size:11px}#minhan-files-design .fs-crumb button{font-size:11px;padding:4px 7px}#minhan-files-design .fs-content{display:grid;grid-template-columns:minmax(0,1fr) 205px;flex:1}#minhan-files-design .fs-browser{padding:4px 20px 22px;min-width:0}#minhan-files-design .fs-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--fs-muted);margin:9px 0 15px}#minhan-files-design .fs-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px}#minhan-files-design .fs-item{position:relative;flex-direction:column;text-align:center;min-width:0;padding:15px 7px;border:1px solid transparent;gap:9px;align-items:center}#minhan-files-design .fs-item.is-selected{background:var(--fs-soft);border-color:var(--fs-line)}#minhan-files-design .fs-item-icon{height:56px;display:grid;place-items:center;color:var(--fs-folder)}#minhan-files-design .fs-item-icon svg{width:47px;height:47px;stroke-width:1.3}#minhan-files-design .fs-item[data-kind="file"] .fs-item-icon{color:var(--fs-accent)}#minhan-files-design .fs-item-name{font-size:11px;font-weight:500;overflow-wrap:anywhere}#minhan-files-design .fs-item-meta{font-size:10px;color:var(--fs-muted)}#minhan-files-design .fs-item-tail{display:none}#minhan-files-design .fs-items.is-list{display:flex;flex-direction:column;gap:0}#minhan-files-design .is-list .fs-item{display:grid;grid-template-columns:28px minmax(0,1fr) 72px;min-height:53px;padding:9px 7px;gap:9px;text-align:left;border-radius:8px}#minhan-files-design .is-list .fs-item-icon{height:auto}#minhan-files-design .is-list .fs-item-icon svg{width:24px;height:24px}#minhan-files-design .is-list .fs-item-meta{display:none}#minhan-files-design .is-list .fs-item-tail{display:block;font-size:10px;color:var(--fs-muted);text-align:right}#minhan-files-design .fs-list-head{display:none;justify-content:space-between;font-size:10px;color:var(--fs-muted);padding:6px 10px 12px;border-bottom:1px solid var(--fs-line)}#minhan-files-design .is-admin .fs-list-head{display:flex}#minhan-files-design .fs-inspector{border-left:1px solid var(--fs-line);padding:7px 18px 22px;min-width:0}#minhan-files-design .fs-inspector-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--fs-muted);padding:5px 0 16px}#minhan-files-design .fs-preview{height:120px;background:var(--fs-side);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fs-accent);gap:10px}#minhan-files-design .fs-preview svg{width:41px;height:41px;stroke-width:1.2}#minhan-files-design .fs-preview span{font-size:10px;color:var(--fs-muted)}#minhan-files-design .fs-inspector h3{font-size:13px;margin:16px 0 4px;overflow-wrap:anywhere;font-weight:600}#minhan-files-design .fs-inspector-sub{font-size:10px;color:var(--fs-muted)}#minhan-files-design .fs-detail{display:flex;justify-content:space-between;gap:10px;font-size:10px;padding:9px 0;border-bottom:1px solid var(--fs-line)}#minhan-files-design .fs-detail span{color:var(--fs-muted)}#minhan-files-design .fs-detail b{font-weight:400;text-align:right}#minhan-files-design .fs-permission{margin-top:18px;padding:10px;background:var(--fs-side);border-radius:10px;font-size:10px;color:var(--fs-muted)}#minhan-files-design .fs-permission strong{font-size:11px;color:var(--fs-ink);font-weight:500;display:block;margin-bottom:5px}#minhan-files-design .fs-selection-actions{display:flex;gap:6px;margin-top:14px}#minhan-files-design .fs-selection-actions button{font-size:11px;padding:7px;background:var(--fs-side)}#minhan-files-design .fs-footer{padding:12px 22px;border-top:1px solid var(--fs-line);display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--fs-muted);font-size:11px}#minhan-files-design .fs-footer button{padding:4px 8px;color:var(--fs-accent);font-size:11px}#minhan-files-design .fs-transfer{margin:0 20px 16px;padding:14px;background:var(--fs-side);border:1px solid var(--fs-line);border-radius:13px}#minhan-files-design .fs-transfer[hidden]{display:none}#minhan-files-design .fs-transfer-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:14px}#minhan-files-design .fs-transfer-row{display:flex;gap:10px;align-items:center;font-size:11px}#minhan-files-design .fs-transfer-row>div{flex:1;min-width:0}#minhan-files-design .fs-transfer-row small{display:block;font-size:10px;color:var(--fs-muted);margin-top:5px}#minhan-files-design .fs-track{height:4px;background:var(--fs-line);border-radius:3px;margin-top:9px;overflow:hidden}#minhan-files-design .fs-track i{display:block;width:62%;height:100%;background:var(--fs-accent)}#minhan-files-design .fs-toast{margin:0 20px 15px;font-size:11px;color:var(--fs-accent);min-height:17px}#minhan-files-design .fs-empty{grid-column:1/-1;font-size:12px;color:var(--fs-muted);padding:40px 10px;text-align:center}#minhan-files-design .fs-dialog{position:absolute;z-index:5;inset:80px 30px auto;margin:auto;max-width:360px;padding:22px;background:var(--fs-bg);border:1px solid var(--fs-line);box-shadow:0 18px 90px #17233830;border-radius:17px}#minhan-files-design .fs-dialog[hidden]{display:none}#minhan-files-design .fs-dialog h3{font-size:17px;font-weight:500;margin:0 0 17px}#minhan-files-design .fs-dialog label{font-size:12px;display:block}#minhan-files-design .fs-dialog input{width:100%;border:1px solid var(--fs-line);background:var(--fs-side);color:var(--fs-ink);padding:10px;border-radius:8px;margin:8px 0 18px}#minhan-files-design .fs-dialog-actions{display:flex;justify-content:flex-end;gap:8px}#minhan-files-design .fs-dialog-error{font-size:11px;color:var(--fs-muted)}
    @media(max-width:850px){#minhan-files-design .fs-content{grid-template-columns:1fr}#minhan-files-design .fs-inspector{border-left:0;border-top:1px solid var(--fs-line);display:grid;grid-template-columns:120px 1fr;gap:0 20px;padding:18px 22px}#minhan-files-design .fs-inspector-head{grid-column:1/-1}#minhan-files-design .fs-preview{grid-row:2/7}#minhan-files-design .fs-inspector h3{margin-top:0}#minhan-files-design .fs-permission{grid-column:1/-1;margin-top:10px}#minhan-files-design .fs-selection-actions{grid-column:1/-1}#minhan-files-design .fs-body{grid-template-columns:160px minmax(0,1fr)}}
    @media(max-width:550px){#minhan-files-design .fs-badge{margin-right:0;font-size:10px}#minhan-files-design .fs-chrome{padding:13px}#minhan-files-design .fs-body{display:block}#minhan-files-design .fs-sidebar{flex-direction:row;flex-wrap:wrap;padding:10px;border-right:0;border-bottom:1px solid var(--fs-line);gap:3px}#minhan-files-design .fs-nav-label,#minhan-files-design .fs-account{display:none}#minhan-files-design .fs-sidebar button{font-size:11px;padding:7px}#minhan-files-design .fs-toolbar{padding:17px 14px 12px;gap:6px}#minhan-files-design .fs-title{width:100%;margin-bottom:7px}#minhan-files-design .fs-title h2{font-size:21px}#minhan-files-design .fs-tools{padding:0 14px 13px}#minhan-files-design .fs-browser{padding:3px 12px 20px}#minhan-files-design .fs-item{padding:12px 5px}#minhan-files-design .fs-items{gap:7px}#minhan-files-design .fs-footer{padding:12px 14px;gap:5px}#minhan-files-design .fs-inspector{padding:16px 14px}#minhan-files-design .fs-item-name{font-size:11px}#minhan-files-design .fs-search{min-width:120px}}
  </style>
  <style>#minhan-files-design .fs-inspector[hidden]{display:none}#minhan-files-design .fs-permission strong svg{width:12px;height:12px;vertical-align:middle}#minhan-files-design .fs-app{min-height:740px}@media(max-width:850px){#minhan-files-design .fs-app{min-height:1040px}}@media(max-width:550px){#minhan-files-design .fs-app{min-height:1170px}}</style>
  <style>#minhan-files-design .fs-item-icon svg{width:47px!important;height:47px!important}#minhan-files-design .is-list .fs-item-icon svg{width:24px!important;height:24px!important}#minhan-files-design .fs-preview svg{width:41px!important;height:41px!important}</style>
  <div class="viz-carousel" aria-label="Thiết kế File Station" data-previous-label="Thiết kế trước" data-next-label="Thiết kế sau">
    <section data-variant="Không gian" aria-label="File Station dạng lưới"><div class="fs-app" data-layout="grid"></div></section>
    <section data-variant="Quản trị" aria-label="File Station danh sách" hidden><div class="fs-app is-admin" data-layout="list"></div></section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('minhan-files-design');
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const initial = [
        {id:'projects',name:'Dự án',kind:'folder',icon:'folder',size:'4 mục',modified:'Hôm nay',parent:'personal'},
        {id:'photos',name:'Hình ảnh',kind:'folder',icon:'folder',size:'2 mục',modified:'Hôm qua',parent:'personal'},
        {id:'docs',name:'Tài liệu',kind:'folder',icon:'folder',size:'2 mục',modified:'Hôm qua',parent:'personal'},
        {id:'plan',name:'Kế hoạch MinhAnOS.pdf',kind:'file',icon:'file-text',size:'2,4 MB',modified:'Hôm nay, 09:42',parent:'personal'},
        {id:'budget',name:'Ngân sách.xlsx',kind:'file',icon:'sheet',size:'148 KB',modified:'Hôm qua, 16:10',parent:'personal'},
        {id:'wallpaper',name:'Hình nền desktop.png',kind:'file',icon:'image',size:'4,8 MB',modified:'28/10/2026',parent:'personal'},
        {id:'design',name:'Thiết kế File Station.pdf',kind:'file',icon:'file-text',size:'1,6 MB',modified:'Hôm nay',parent:'projects'},
        {id:'spec',name:'Yêu cầu chức năng.md',kind:'file',icon:'file-text',size:'12 KB',modified:'Hôm nay',parent:'projects'},
        {id:'demo',name:'Desktop demo.mp4',kind:'file',icon:'film',size:'128 MB',modified:'Hôm qua',parent:'projects'},
        {id:'assets',name:'Tài nguyên',kind:'folder',icon:'folder',size:'0 mục',modified:'Hôm qua',parent:'projects'},
        {id:'garden',name:'Khu vườn.jpg',kind:'file',icon:'image',size:'3,2 MB',modified:'Hôm qua',parent:'photos'},
        {id:'trip',name:'Chuyến đi.jpg',kind:'file',icon:'image',size:'2,1 MB',modified:'Hôm qua',parent:'photos'},
        {id:'guide',name:'Hướng dẫn.pdf',kind:'file',icon:'file-text',size:'820 KB',modified:'Hôm qua',parent:'docs'},
        {id:'todo',name:'Công việc.txt',kind:'file',icon:'file-text',size:'4 KB',modified:'Hôm qua',parent:'docs'},
        {id:'team',name:'Tài liệu nhóm',kind:'folder',icon:'folder',size:'1 mục',modified:'Hôm nay',parent:'shared'},
        {id:'meeting',name:'Biên bản cuộc họp.pdf',kind:'file',icon:'file-text',size:'650 KB',modified:'Hôm nay',parent:'team'},
        {id:'deleted',name:'Bản nháp cũ.txt',kind:'file',icon:'file-text',size:'2 KB',modified:'27/10/2026',parent:'personal',trash:true}
      ];
      const names = {personal:'Tệp của tôi',shared:'Thư mục chung',recent:'Gần đây',starred:'Yêu thích',trash:'Thùng rác'};
      const saved = window.openai?.widgetState?.privateContent || {};
      const applySaved = [];
      root.querySelectorAll('.fs-app').forEach((app,index) => {
        const files = initial.map(f=>({...f}));
        let location = 'personal', selected = 'plan', view = saved[index]?.view || app.dataset.layout, query = '', paused = false;
        const starred = new Set(['plan','design']);
        app.innerHTML = `
          <header class="fs-chrome"><span class="fs-logo">${icon('folder-open')}</span><strong>File Station</strong><span class="fs-badge">Bản thiết kế · Dữ liệu minh họa</span></header>
          <div class="fs-body"><nav class="fs-sidebar" aria-label="Vị trí tệp"><span class="fs-nav-label">Thư viện</span>
          ${[['personal','folder','Tệp của tôi'],['recent','clock-3','Gần đây'],['starred','star','Yêu thích']].map(([id,ico,label])=>`<button class="cursor-interaction" data-nav="${id}">${icon(ico)}${label}</button>`).join('')}
          <span class="fs-nav-label">Không gian chung</span><button class="cursor-interaction" data-nav="shared">${icon('users')}Thư mục chung</button><button class="cursor-interaction" data-nav="trash">${icon('trash-2')}Thùng rác</button>
          <div class="fs-account"><span class="fs-avatar">M</span><span><strong>Minh An</strong>Không gian cá nhân</span></div></nav>
          <main class="fs-main"><div class="fs-toolbar"><div class="fs-title"><h2>Tệp của tôi</h2><p>Không gian cho những điều bạn tạo ra.</p></div><button class="fs-action cursor-interaction" data-new>${icon('folder-plus')}Thư mục mới</button><button class="fs-primary cursor-interaction" data-upload>${icon('upload')}Tải lên</button></div>
          <div class="fs-tools"><label class="fs-search">${icon('search')}<input aria-label="Tìm trong thư mục" placeholder="Tìm trong thư mục này…"></label><div class="fs-view-buttons"><button class="cursor-interaction" data-view="grid" aria-label="Dạng lưới">${icon('layout-grid')}</button><button class="cursor-interaction" data-view="list" aria-label="Dạng danh sách">${icon('list')}</button><button class="cursor-interaction" data-info aria-label="Ẩn hiện thông tin">${icon('panel-right')}</button></div></div>
          <div class="fs-crumb"></div><div class="fs-content"><section class="fs-browser" aria-label="Danh sách tệp"><div class="fs-section-label">Thư mục & tệp</div><div class="fs-list-head"><span>Tên</span><span>Kích thước</span></div><div class="fs-items"></div></section><aside class="fs-inspector" aria-label="Thông tin tệp"></aside></div>
          <section class="fs-transfer" aria-label="Tác vụ minh họa" hidden><div class="fs-transfer-head"><strong>Tác vụ tải lên</strong><span>Minh họa</span></div><div class="fs-transfer-row">${icon('file-archive')}<div><span>MinhAnOS-assets.zip</span><small data-transfer-state>62 MB / 100 MB · Đang tải lên</small><div class="fs-track"><i></i></div></div><button class="cursor-interaction" data-pause aria-label="Tạm dừng tác vụ">${icon('pause')}</button><button class="cursor-interaction" data-hide-transfer aria-label="Thu gọn tác vụ">${icon('chevron-down')}</button></div></section>
          <div class="fs-toast" role="status" aria-live="polite"></div><footer class="fs-footer"><span data-count></span><span>Chỉ bạn có quyền truy cập</span><button class="cursor-interaction" data-tasks>${icon('arrow-up-down')}Tác vụ</button></footer></main></div>
          <form class="fs-dialog" aria-label="Tạo thư mục minh họa" hidden><h3>Thư mục mới</h3><label>Tên thư mục<input name="folder" required maxlength="80" placeholder="Nhập tên thư mục"></label><p class="fs-dialog-error" role="alert"></p><div class="fs-dialog-actions"><button type="button" class="cursor-interaction" data-cancel>Hủy</button><button class="fs-primary cursor-interaction" type="button" data-create>Tạo thư mục</button></div></form>`;
        const $ = s => app.querySelector(s);
        const persist = () => { if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen:'File Station',variant:index===0?'Không gian':'Quản trị',view,location},privateContent:{[index]:{view}}}).catch(()=>{}); };
        const toast = text => { $('.fs-toast').textContent=text; };
        const safe = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const title = () => names[location] || files.find(f=>f.id===location)?.name || 'Thư mục';
        const visible = () => files.filter(f => (location==='trash'?f.trash:!f.trash && (location==='recent'?f.kind==='file':location==='starred'?starred.has(f.id):f.parent===location)) && f.name.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));
        function render(){
          $('.fs-title h2').textContent=title();
          app.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('is-active', b.dataset.nav===location));
          app.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('is-active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view));});
          app.classList.toggle('is-admin',view==='list');
          $('.fs-items').classList.toggle('is-list',view==='list');
          $('.fs-crumb').innerHTML=`<button class="cursor-interaction" data-root>${icon('house')}Tệp của tôi</button>${location!=='personal'?`${icon('chevron-right')}<span>${safe(title())}</span>`:''}`;
          const items=visible();
          $('.fs-items').innerHTML=items.length?items.map(f=>`<button class="fs-item cursor-interaction ${selected===f.id?'is-selected':''}" data-file="${f.id}" data-kind="${f.kind}" aria-label="${safe(f.kind==='folder'?'Mở thư mục '+f.name:'Chọn '+f.name)}" aria-pressed="${selected===f.id}"><span class="fs-item-icon">${icon(f.icon)}</span><span class="fs-item-name">${safe(f.name)}</span><span class="fs-item-meta">${safe(f.size)}</span><span class="fs-item-tail">${safe(f.size)}</span></button>`).join(''):'<p class="fs-empty">Không có mục nào ở đây.</p>';
          $('[data-count]').textContent=items.length+' mục';
          $('.fs-footer>span:nth-child(2)').textContent=location==='shared'||location==='team'?'Quyền theo thư mục chung':'Không gian cá nhân';
          const f=files.find(f=>f.id===selected && items.some(i=>i.id===f.id));
          $('.fs-inspector').innerHTML=f?`<div class="fs-inspector-head"><span>Thông tin</span>${icon('info')}</div><div class="fs-preview">${icon(f.icon)}<span>${f.kind==='folder'?'Thư mục':f.name.split('.').pop().toUpperCase()+' · Xem trước'}</span></div><h3>${safe(f.name)}</h3><div class="fs-inspector-sub">${safe(f.size)} · ${f.kind==='folder'?'Thư mục':'Tệp'}</div><div class="fs-detail"><span>Chủ sở hữu</span><b>Minh An</b></div><div class="fs-detail"><span>Thay đổi</span><b>${safe(f.modified)}</b></div><div class="fs-permission"><strong>${icon('lock-keyhole')} ${location==='shared'||f.parent==='team'?'Không gian chung':'Riêng tư'}</strong>Quyền đọc, ghi được kiểm tra theo tài khoản và thư mục.</div><div class="fs-selection-actions"><button class="cursor-interaction" data-star aria-label="${starred.has(f.id)?'Bỏ yêu thích':'Yêu thích'}">${icon('star')}</button>${f.trash?`<button class="cursor-interaction" data-restore>${icon('rotate-ccw')}Khôi phục</button>`:`<button class="cursor-interaction" data-trash aria-label="Đưa vào thùng rác">${icon('trash-2')}</button><button class="cursor-interaction" data-preview>${icon('scan-eye')}Xem trước</button>`}</div>`:'<div class="fs-inspector-head">Thông tin</div><p class="fs-inspector-sub">Chọn một tệp để xem thông tin.</p>';
          if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
        }
        app.addEventListener('click',event=>{
          const b=event.target.closest('button');if(!b)return;
          if(b.dataset.nav){location=b.dataset.nav;selected='';query='';$('.fs-search input').value='';toast('');render();persist();}
          if(b.hasAttribute('data-root')){location='personal';selected='plan';query='';$('.fs-search input').value='';render();}
          if(b.dataset.view){view=b.dataset.view;render();persist();}
          if(b.dataset.file){const f=files.find(f=>f.id===b.dataset.file);if(f.kind==='folder'&&!f.trash){location=f.id;query='';$('.fs-search input').value='';selected='';}else selected=f.id;render();persist();}
          if(b.hasAttribute('data-info')){const hidden=$('.fs-inspector').hidden;$('.fs-inspector').hidden=!hidden;$('.fs-content').style.gridTemplateColumns=hidden?'':'1fr';}
          if(b.hasAttribute('data-upload')){$('.fs-transfer').hidden=false;toast('Mô phỏng tác vụ tải lên — không đọc hoặc gửi tệp thật.');}
          if(b.hasAttribute('data-tasks'))$('.fs-transfer').hidden=!$('.fs-transfer').hidden;
          if(b.hasAttribute('data-hide-transfer'))$('.fs-transfer').hidden=true;
          if(b.hasAttribute('data-pause')){paused=!paused;$('[data-transfer-state]').textContent=paused?'62 MB / 100 MB · Đã tạm dừng':'62 MB / 100 MB · Đang tải lên';b.setAttribute('aria-label',paused?'Tiếp tục tác vụ':'Tạm dừng tác vụ');b.innerHTML=icon(paused?'play':'pause');if(globalThis.lucide)lucide.createIcons();}
          if(b.hasAttribute('data-new')){if(['trash','recent','starred'].includes(location)){toast('Chọn một thư mục trước khi tạo mục mới.');return;}$('.fs-dialog').hidden=false;$('.fs-dialog input').focus();}
          if(b.hasAttribute('data-create'))createFolder();
          if(b.hasAttribute('data-cancel'))$('.fs-dialog').hidden=true;
          if(b.hasAttribute('data-star')){starred.has(selected)?starred.delete(selected):starred.add(selected);render();toast('Đã cập nhật yêu thích trong bản mẫu.');}
          if(b.hasAttribute('data-trash')){const f=files.find(f=>f.id===selected);f.trash=true;selected='';render();toast('Đã chuyển tệp minh họa vào Thùng rác.');}
          if(b.hasAttribute('data-restore')){files.find(f=>f.id===selected).trash=false;selected='';render();toast('Đã khôi phục tệp minh họa.');}
          if(b.hasAttribute('data-preview'))toast('Thiết kế dự kiến hỗ trợ ảnh, PDF, văn bản; chưa nạp nội dung tệp trong bản mẫu.');
        });
        $('.fs-search input').addEventListener('input',e=>{query=e.target.value;render();});
        function createFolder(){const name=$('.fs-dialog input').value.trim();if(!name || /[\\/]/.test(name) || name==='.' || name==='..'){$('.fs-dialog-error').textContent='Tên thư mục không hợp lệ.';return;}if(files.some(f=>!f.trash&&f.parent===location&&f.name===name)){$('.fs-dialog-error').textContent='Tên này đã tồn tại.';return;}files.push({id:'new-'+Date.now(),name,kind:'folder',icon:'folder',size:'0 mục',modified:'Vừa tạo',parent:location});$('.fs-dialog').hidden=true;$('.fs-dialog input').value='';$('.fs-dialog-error').textContent='';render();toast('Đã tạo thư mục trong bản mẫu.');}
        $('.fs-dialog').addEventListener('submit',e=>{e.preventDefault();createFolder();});
        app.addEventListener('keydown',e=>{if(e.key==='Escape')$('.fs-dialog').hidden=true;});
        render();
        applySaved.push(state=>{if(state?.[index]?.view && ['grid','list'].includes(state[index].view)){view=state[index].view;render();}});
        if(globalThis.Tweak){const options={details:true,spacing:12};const tweak=new Tweak({container:app,onChange:()=>{$('.fs-inspector').hidden=!options.details;$('.fs-content').style.gridTemplateColumns=options.details?'':'1fr';$('.fs-items').style.gap=view==='grid'?options.spacing+'px':'0';}});tweak.addToggle(options,'details',{label:'Bảng thông tin'});tweak.addSlider(options,'spacing',{label:'Khoảng cách tệp',min:6,max:24,unit:'px'});}
      });
      window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;applySaved.forEach(apply=>apply(state));});
    })();
  </script>
</div>
