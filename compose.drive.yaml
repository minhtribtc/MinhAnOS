# Standalone Drive: no desktop image, service, browser shell or platform API required.
name: minhanos-drive
services:
  drive:
    build:
      context: .
      dockerfile: Drive.Dockerfile
    restart: unless-stopped
    ports:
      - "${MINHANOS_BIND_IP:-127.0.0.1}:${DRIVE_PORT:-8082}:8082"
    environment:
      DATABASE_URL: "postgres://minhanos:${POSTGRES_PASSWORD}@db:5432/minhanos?sslmode=disable"
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      # Standalone Files has no first-run setup screen: it creates the bootstrap admin.
      MINHANOS_BOOTSTRAP_ADMIN: "true"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    secrets: [bootstrap_password]
    volumes: [drive-files:/data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: minhanos
      POSTGRES_DB: minhanos
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes: [drive-database:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minhanos -d minhanos"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  bootstrap_password:
    file: ./secrets/bootstrap_password
volumes:
  drive-files:
  drive-database:
